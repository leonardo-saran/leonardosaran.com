<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="container header-inner">

    <nav class="main-nav">
      <a href="#main" class="skip-link" data-i18n="common.skipToContent">Skip to content</a>
      <!-- Skip link keeps a fragment href (never a route): its click handler
           preventDefaults, so the pathname router never sees #main. -->
      <a href="/about" class="nav-link" data-nav>
        <span data-i18n="nav.about">About</span>
      </a>
      <a href="/archive" class="nav-link" data-nav>
        <span data-i18n="nav.archive">Archive</span>
      </a>
      <a href="/portfolio" class="nav-link" data-nav>
        <span data-i18n="nav.portfolio">Portfolio</span>
      </a>
    </nav>

    <div class="header-controls">
      <!-- Theme toggle: Sun / Moon -->
      <button class="ctrl-icon ctrl-icon-theme" id="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme" data-i18n-title="common.toggleTheme" data-i18n-aria-label="common.toggleTheme">
        <svg class="theme-sun" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-moon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Language toggle: Globe / PT / Globe / EN cycle -->
      <button class="ctrl-icon ctrl-icon-lang" id="lang-toggle-btn" aria-label="Toggle language" title="Toggle language" data-i18n-title="common.toggleLanguage" data-i18n-aria-label="common.toggleLanguage">
        <span class="lang-globe">
          <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
        </span>

        <span class="lang-text lang-text-en" aria-hidden="true">EN</span>
      </button>
    </div>

  </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main id="main" tabindex="-1">

  <!-- SECTION: Archive (Blog Post List) -->
  <section id="archive" class="page-section" data-page="archive">
    <div class="container section-padding">

      <h1 class="sr-only" data-i18n="nav.archive">Archive</h1>

      <!-- Toolbar markup mirrors the portfolio twin: keep in sync. -->
      <div class="archive-toolbar animate-in">
        <div class="search-control" id="search-control">
          <div class="search-btn" id="search-btn">
            <svg class="search-btn-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" class="search-btn-input" id="search-btn-input" placeholder="Search..." aria-label="Search posts" data-i18n-placeholder="common.search" data-i18n-aria-label="common.search">
          </div>
          <label class="sr-only" for="search-btn-input">Search posts</label>
        </div>
        <div class="sort-control" id="sort-control" data-sort="new">
          <button class="sort-btn" id="sort-btn" aria-label="Sort posts" data-i18n-aria-label="common.sortPosts">
            <svg class="sort-btn-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="9" y1="5" x2="9" y2="13"/>
              <polyline points="6 9 9 5 12 9"/>
              <line x1="15" y1="11" x2="15" y2="19"/>
              <polyline points="12 15 15 19 18 15"/>
            </svg>
            <span class="sort-btn-label" data-i18n="common.orderBy">Order by</span>
          </button>
          <div class="sort-menu">
            <button class="sort-opt" data-sort="new">
              <span data-i18n="common.newest">Newest</span>
            </button>
            <button class="sort-opt" data-sort="old">
              <span data-i18n="common.oldest">Oldest</span>
            </button>
            <button class="sort-opt" data-sort="az">
              <span data-i18n="common.az">A-Z</span>
            </button>
            <button class="sort-opt" data-sort="za">
              <span data-i18n="common.za">Z-A</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Post List -->
      <div class="post-list-wrap" id="post-list"></div>

      <!-- No Search Results (hidden via CSS class: no inline styles, audit-6 S3/Q5) -->
      <div class="search-no-results" id="search-no-results" aria-live="polite">
        <p data-i18n="common.noResults">No posts found matching your search.</p>
      </div>

      <!-- Pagination (rendered dynamically by app.js) -->
      <nav class="pagination" id="pagination" aria-label="Pagination" hidden></nav>

    </div>
  </section>

  <!-- SECTION: Single Post View -->
  <section id="post" class="page-section" data-page="post">
    <div class="container section-padding">
      <article class="post-article">

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/archive" data-nav>
            <span data-i18n="breadcrumb.archive">Archive</span>
          </a>
          <span class="breadcrumb-sep">/</span>
          <span aria-current="page" data-i18n="breadcrumb.post">Post</span>
        </nav>

        <!-- Post Header -->
        <div class="post-header">
          <div class="post-meta">
            <time></time>
            <span class="post-meta-sep">·</span>
          </div>
          <h1 class="post-title"></h1>
          <span class="sr-only post-title-live" aria-live="polite"></span>
        </div>

        <!-- Post Content -->
        <div class="post-content">
          <!-- Content loaded from Markdown -->
        </div>

      </article>
    </div>
  </section>

  <!-- SECTION: About Page -->
  <section id="about" class="page-section active" data-page="about">
    <div class="container section-padding">
      <div class="about-layout">

        <!-- Photo: probed and injected at runtime (CSP-safe, no inline handlers) -->
        <div class="about-photo-area animate-in">
          <div class="about-photo-frame">
            <span class="about-initials">LS</span>
          </div>
        </div>

        <!-- Content -->
        <div class="about-content animate-in animate-in-d1">
          <h1 data-i18n="about.name">Leonardo Saran</h1>

          <div id="about-bio">
            <div class="bio">
              <!-- Bio content loaded from Markdown -->
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- SECTION: Portfolio Page -->
  <section id="portfolio" class="page-section" data-page="portfolio">
    <div class="container section-padding">

      <h1 class="sr-only" data-i18n="nav.portfolio">Portfolio</h1>

      <!-- Toolbar markup mirrors the archive twin: keep in sync. -->
      <div class="archive-toolbar animate-in">
        <div class="search-control" id="portfolio-search-control">
          <div class="search-btn" id="portfolio-search-btn">
            <svg class="search-btn-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" class="search-btn-input" id="portfolio-search-input" placeholder="Search..." aria-label="Search portfolio" data-i18n-placeholder="common.search" data-i18n-aria-label="common.search">
          </div>
          <label class="sr-only" for="portfolio-search-input">Search portfolio</label>
        </div>
        <div class="sort-control" id="portfolio-sort-control" data-sort="new">
          <button class="sort-btn" id="portfolio-sort-btn" aria-label="Sort portfolio" data-i18n-aria-label="common.sortPortfolio">
            <svg class="sort-btn-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="9" y1="5" x2="9" y2="13"/>
              <polyline points="6 9 9 5 12 9"/>
              <line x1="15" y1="11" x2="15" y2="19"/>
              <polyline points="12 15 15 19 18 15"/>
            </svg>
            <span class="sort-btn-label" data-i18n="common.orderBy">Order by</span>
          </button>
          <div class="sort-menu">
            <button class="sort-opt" data-sort="new">
              <span data-i18n="common.newest">Newest</span>
            </button>
            <button class="sort-opt" data-sort="old">
              <span data-i18n="common.oldest">Oldest</span>
            </button>
            <button class="sort-opt" data-sort="az">
              <span data-i18n="common.az">A-Z</span>
            </button>
            <button class="sort-opt" data-sort="za">
              <span data-i18n="common.za">Z-A</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Portfolio Post List -->
      <div class="post-list-wrap" id="portfolio-post-list"></div>

      <!-- No Search Results (hidden via CSS class: no inline styles, audit-6 S3/Q5) -->
      <div class="search-no-results" id="portfolio-no-results" aria-live="polite">
        <p data-i18n="common.noPortfolioResults">No portfolio items found matching your search.</p>
      </div>

      <!-- Pagination (rendered dynamically by app.js) -->
      <nav class="pagination" id="portfolio-pagination" aria-label="Pagination" hidden></nav>

    </div>
  </section>

  <!-- SECTION: Not Found (unknown routes) -->
  <section id="not-found" class="page-section" data-page="not-found">
    <div class="container section-padding">
      <h1 class="sr-only" data-i18n="page.notFound.title">Page not found</h1>
      <p class="search-no-results search-no-results--visible" data-i18n="page.notFound.body">The page you are looking for does not exist.</p>
    </div>
  </section>

</main>
